# _quarto.yml
project:
  type: website

website:
  title: "Aprendizaje Maquina Estadístico"
  navbar:
    right:
      - icon: github
        href: https://github.com/PavelS130/AprendizajeMaquinaEst.git

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    embed-resources: true  # Empaqueta CSS/JS en un solo HTML (útil para compatibilidad)

execute:
  echo: true
  warning: false
  message: false
  freeze: auto  # Guarda resultados para no volver a ejecutar innecesariamente

# Especifica el kernel de Julia (ajusta según tu versión)
jupyter: julia-1.11


